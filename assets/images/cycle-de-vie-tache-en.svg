<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="A2A task lifecycle">
<title>A2A task lifecycle</title>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="860" height="440" fill="#ffffff"/>
<text x="30" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" >● In progress</text>
<text x="140" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold" >● Interrupted</text>
<text x="275" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold" >● Terminal (success)</text>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="bold" >● Terminal (failure / refusal)</text>
<circle cx="40" cy="150" r="9" fill="#1f2937"/>
<line x1="49" y1="150" x2="93" y2="150" stroke="#1f2937" stroke-width="1.8" marker-end="url(#a-ink)"/>
<rect x="95.0" y="128" width="170" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="180" y="155" font-family="Consolas, Menlo, monospace" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" >SUBMITTED</text>
<line x1="265" y1="150" x2="363" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="365.0" y="128" width="170" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="450" y="155" font-family="Consolas, Menlo, monospace" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold" >WORKING</text>
<rect x="645.0" y="73" width="190" height="44" rx="22" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="740" y="100" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold" >INPUT_REQUIRED</text>
<rect x="645.0" y="183" width="190" height="44" rx="22" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="740" y="210" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold" >AUTH_REQUIRED</text>
<line x1="530" y1="136" x2="643" y2="96" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="645" y1="110" x2="535" y2="148" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="535" y1="154" x2="645" y2="192" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="643" y1="206" x2="530" y2="166" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="105.0" y="338" width="150" height="44" rx="22" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="180" y="365" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold" >REJECTED</text>
<rect x="305.0" y="338" width="150" height="44" rx="22" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="380" y="365" font-family="Consolas, Menlo, monospace" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold" >COMPLETED</text>
<rect x="505.0" y="338" width="130" height="44" rx="22" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="570" y="365" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold" >FAILED</text>
<rect x="685.0" y="338" width="130" height="44" rx="22" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="750" y="365" font-family="Consolas, Menlo, monospace" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold" >CANCELED</text>
<line x1="180" y1="172" x2="180" y2="336" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="430" y1="172" x2="385" y2="336" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="470" y1="172" x2="560" y2="336" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<line x1="500" y1="170" x2="725" y2="336" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a-muted)"/>
<text x="430" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >A terminal state closes the SSE stream: the task can no longer change.</text>
</svg>
