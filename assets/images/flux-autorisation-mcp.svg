<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-label="Le client MCP découvre seul où et comment obtenir son jeton" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5">
  <title>Flux d'autorisation MCP : 10 échanges entre le client, le serveur MCP et le serveur d'autorisation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a90"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f6fdb"/>
    </marker>
  </defs>
  <rect width="760" height="576" fill="#ffffff"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Le client MCP découvre seul où et comment obtenir son jeton</text>

  <!-- Acteurs et lignes de vie -->
  <g stroke="#9a9a90" stroke-width="1.25">
    <rect x="10" y="56" width="200" height="40" rx="8" fill="none"/>
    <rect x="280" y="56" width="200" height="40" rx="8" fill="none"/>
    <rect x="550" y="56" width="200" height="40" rx="8" fill="none"/>
  </g>
  <g stroke="#dcdcd4" stroke-width="1.25" stroke-dasharray="4 4">
    <line x1="110" y1="96" x2="110" y2="552"/>
    <line x1="380" y1="96" x2="380" y2="552"/>
    <line x1="650" y1="96" x2="650" y2="552"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">
    <text x="110" y="80">Client MCP</text>
    <text x="380" y="80">Serveur MCP (ressource)</text>
    <text x="650" y="80">Serveur d'autorisation</text>
  </g>

  <!-- Messages -->
  <g fill="none" stroke="#9a9a90" stroke-width="1.25" marker-end="url(#arrow)">
    <path d="M110 136H380"/>
    <path d="M380 180H110" stroke-dasharray="5 4"/>
    <path d="M110 224H380"/>
    <path d="M380 268H110" stroke-dasharray="5 4"/>
    <path d="M110 312H650"/>
    <path d="M110 356H650"/>
    <path d="M650 400H110" stroke-dasharray="5 4"/>
    <path d="M110 444H650"/>
    <path d="M650 488H110" stroke-dasharray="5 4"/>
  </g>
  <path d="M110 532H380" fill="none" stroke="#2f6fdb" stroke-width="2" marker-end="url(#arrow-hot)"/>

  <g>
    <text x="122" y="128" fill="#1f1f1f">1. Requête MCP sans jeton</text>
    <text x="122" y="172" fill="#666660">2. 401 + WWW-Authenticate</text>
    <text x="122" y="216" fill="#1f1f1f">3. Métadonnées de ressource (RFC 9728)</text>
    <text x="122" y="260" fill="#666660">4. Adresse du serveur d'autorisation</text>
    <text x="122" y="304" fill="#1f1f1f">5. Métadonnées AS (RFC 8414 ou OIDC)</text>
    <text x="122" y="348" fill="#1f1f1f">6. Autorisation + PKCE, client_id CIMD</text>
    <text x="122" y="392" fill="#666660">7. Code + iss, après consentement</text>
    <text x="122" y="436" fill="#1f1f1f">8. Code + code_verifier + resource</text>
    <text x="122" y="480" fill="#666660">9. Access token lié au serveur MCP</text>
    <text x="122" y="524" font-weight="600" fill="#1f1f1f">10. Requête + Authorization: Bearer</text>
  </g>
</svg>
