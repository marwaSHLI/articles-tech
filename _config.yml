# Configuration du site GitHub Pages (Jekyll)
# Remplacez les valeurs entre <...> par les vôtres.

title: "Notes techniques"
description: "Articles sur l'architecture, la sécurité et les API."
author: "marwa SAHLI"
lang: fr

# Si le dépôt s'appelle <votre-nom>.github.io : laissez baseurl vide.
# Sinon : baseurl = "/<nom-du-depot>" (ex. "/blog-auth").
url: "https://marwashli.github.io"
baseurl: "/articles-tech"

theme: minima
markdown: kramdown
kramdown:
  input: GFM

permalink: /:year/:month/:title/
show_excerpts: true

minima:
  date_format: "%d/%m/%Y"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Bilingue : les articles sont en français par défaut.
# Un article anglais déclare `lang: en` ; ses deux versions partagent le même `ref`.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: fr

# Pages affichées dans le menu du haut.
header_pages:
  - index.html
  - about.md
  - en/index.html

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
